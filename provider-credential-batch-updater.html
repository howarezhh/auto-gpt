<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提供商密钥批量更新</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f5;
      --surface: #ffffff;
      --surface-soft: #eef3f1;
      --line: #d6dfdc;
      --line-strong: #aebbb7;
      --text: #17211e;
      --muted: #62716d;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --accent-soft: #dff3ef;
      --danger: #b42318;
      --danger-soft: #fee4df;
      --warn: #a05a00;
      --warn-soft: #fff1d6;
      --ok: #14713d;
      --ok-soft: #ddf5e8;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      --radius: 0;
      --gap: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111716;
        --surface: #18211f;
        --surface-soft: #202b28;
        --line: #33413d;
        --line-strong: #51615d;
        --text: #edf4f1;
        --muted: #a6b5b0;
        --accent: #5ed0c3;
        --accent-strong: #8fe2d8;
        --accent-soft: #173b38;
        --danger: #ff897f;
        --danger-soft: #44201d;
        --warn: #ffc96f;
        --warn-soft: #3f2b10;
        --ok: #7bdba3;
        --ok-soft: #173a27;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.15;
      font-weight: 800;
    }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 13px;
      white-space: nowrap;
    }

    .pill.ok {
      color: var(--ok);
      background: var(--ok-soft);
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: var(--gap);
      padding: 16px;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .panel-body {
      padding: 16px;
    }

    .side {
      align-self: start;
      position: sticky;
      top: 88px;
      display: grid;
      gap: var(--gap);
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
    }

    input {
      height: 40px;
      padding: 0 11px;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.55;
      font-family: var(--mono);
      font-size: 12px;
    }

    .inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      color: var(--text);
      background: var(--surface-soft);
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .btn:hover {
      background: color-mix(in srgb, var(--surface-soft) 72%, var(--accent) 28%);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      color: #fff;
      background: var(--accent);
    }

    .btn.primary:hover {
      background: var(--accent-strong);
    }

    .btn.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .btn.small {
      min-height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr) auto;
      gap: var(--gap);
      min-width: 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .search {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(120px, 180px);
      gap: 8px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: var(--surface-soft);
      font-weight: 800;
    }

    tr[data-dirty="true"] {
      background: color-mix(in srgb, var(--warn-soft) 42%, transparent);
    }

    tr[data-result="success"] {
      background: color-mix(in srgb, var(--ok-soft) 58%, transparent);
    }

    tr[data-result="failed"] {
      background: color-mix(in srgb, var(--danger-soft) 58%, transparent);
    }

    .check-cell {
      width: 40px;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
    }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .name-cell {
      display: grid;
      gap: 3px;
      min-width: 160px;
    }

    .provider-name {
      font-weight: 800;
    }

    .secondary {
      color: var(--muted);
      font-size: 12px;
    }

    .key-input {
      min-width: 320px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .hint-input {
      min-width: 170px;
    }

    .row-actions {
      display: inline-flex;
      gap: 6px;
      white-space: nowrap;
    }

    .result {
      min-width: 130px;
      color: var(--muted);
    }

    .log {
      max-height: 180px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--surface);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line-strong);
      background: var(--surface);
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: grid;
      gap: 8px;
      width: min(420px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      pointer-events: auto;
    }

    .toast-item.ok {
      border-color: color-mix(in srgb, var(--ok) 45%, var(--line));
    }

    .toast-item.danger {
      border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .statusbar {
        justify-content: flex-start;
      }

      main {
        padding: 10px;
      }

      .search,
      .inline {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">钥</div>
        <div>
          <h1>提供商密钥批量更新</h1>
          <div class="secondary">/api/provider-credentials</div>
        </div>
      </div>
      <div class="statusbar" aria-live="polite">
        <span id="connectionPill" class="pill warn">未连接</span>
        <span id="countPill" class="pill">0 个提供商</span>
        <span id="dirtyPill" class="pill">0 个待提交</span>
      </div>
    </header>

    <main>
      <aside class="side" aria-label="连接与批量输入">
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">连接</h2>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <label>
                服务地址
                <input id="baseUrl" autocomplete="url" spellcheck="false" placeholder="http://127.0.0.1:8000">
              </label>
              <label>
                管理员账号
                <input id="username" autocomplete="username" placeholder="admin">
              </label>
              <label>
                管理员密码
                <input id="password" type="password" autocomplete="current-password">
              </label>
              <div class="actions">
                <button id="loadBtn" class="btn primary" type="button">拉取</button>
                <button id="forgetBtn" class="btn" type="button">清空凭据</button>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">批量粘贴</h2>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <textarea id="pasteBox" spellcheck="false" placeholder='[{"provider_id":23,"api_key":"sk-new","credential_hint":"更新"}]'></textarea>
              <div class="actions">
                <button id="parseBtn" class="btn" type="button">导入</button>
                <button id="sampleBtn" class="btn" type="button">示例</button>
              </div>
            </div>
          </div>
        </section>
      </aside>

      <section class="workspace" aria-label="提供商密钥表格">
        <div class="toolbar">
          <div class="search">
            <label>
              搜索
              <input id="keyword" placeholder="名称、ID、Base URL">
            </label>
            <label>
              显示
              <input id="filterMode" list="filterModes" value="全部">
              <datalist id="filterModes">
                <option value="全部"></option>
                <option value="已修改"></option>
                <option value="已选择"></option>
                <option value="失败"></option>
              </datalist>
            </label>
          </div>
          <div class="actions">
            <button id="selectAllBtn" class="btn" type="button">全选</button>
            <button id="addRowBtn" class="btn" type="button">新增行</button>
            <button id="submitBtn" class="btn primary" type="button">提交</button>
          </div>
        </div>

        <div id="tableHost" class="table-wrap">
          <div class="empty">暂无数据</div>
        </div>

        <pre id="resultLog" class="log" aria-live="polite">等待操作</pre>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <template id="tableTemplate">
    <table>
      <thead>
        <tr>
          <th class="check-cell"><span class="sr-only">选择</span></th>
          <th>ID / 名称</th>
          <th>Base URL</th>
          <th>API Key</th>
          <th>备注</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="providerRows"></tbody>
    </table>
  </template>

  <script>
    const els = {
      baseUrl: document.querySelector("#baseUrl"),
      username: document.querySelector("#username"),
      password: document.querySelector("#password"),
      loadBtn: document.querySelector("#loadBtn"),
      forgetBtn: document.querySelector("#forgetBtn"),
      pasteBox: document.querySelector("#pasteBox"),
      parseBtn: document.querySelector("#parseBtn"),
      sampleBtn: document.querySelector("#sampleBtn"),
      keyword: document.querySelector("#keyword"),
      filterMode: document.querySelector("#filterMode"),
      selectAllBtn: document.querySelector("#selectAllBtn"),
      addRowBtn: document.querySelector("#addRowBtn"),
      submitBtn: document.querySelector("#submitBtn"),
      tableHost: document.querySelector("#tableHost"),
      resultLog: document.querySelector("#resultLog"),
      connectionPill: document.querySelector("#connectionPill"),
      countPill: document.querySelector("#countPill"),
      dirtyPill: document.querySelector("#dirtyPill"),
      toast: document.querySelector("#toast"),
      tableTemplate: document.querySelector("#tableTemplate")
    };

    let rows = [];
    let busy = false;

    init();

    function init() {
      els.baseUrl.value = localStorage.getItem("providerCredentialBaseUrl") || location.origin || "http://127.0.0.1:8000";
      els.username.value = localStorage.getItem("providerCredentialUsername") || "";
      bindEvents();
      render();
    }

    function bindEvents() {
      els.loadBtn.addEventListener("click", () => loadProviders());
      els.forgetBtn.addEventListener("click", forgetCredentials);
      els.parseBtn.addEventListener("click", importPastedRows);
      els.sampleBtn.addEventListener("click", fillSample);
      els.keyword.addEventListener("input", render);
      els.filterMode.addEventListener("input", render);
      els.selectAllBtn.addEventListener("click", toggleSelectAll);
      els.addRowBtn.addEventListener("click", addBlankRow);
      els.submitBtn.addEventListener("click", submitSelected);
      els.baseUrl.addEventListener("change", persistSafeSettings);
      els.username.addEventListener("change", persistSafeSettings);
    }

    function persistSafeSettings() {
      localStorage.setItem("providerCredentialBaseUrl", normalizeBaseUrl(els.baseUrl.value));
      localStorage.setItem("providerCredentialUsername", els.username.value.trim());
    }

    function forgetCredentials() {
      els.username.value = "";
      els.password.value = "";
      localStorage.removeItem("providerCredentialUsername");
      toast("已清空账号与密码", "ok");
    }

    async function loadProviders() {
      const auth = readAuth();
      if (!auth) return;
      setBusy(true, "拉取中");
      try {
        const data = await postJson("/api/provider-credentials/list", auth);
        rows = (data.providers || []).map((item) => normalizeRow({
          id: item.id,
          name: item.name,
          base_url: item.base_url,
          enabled: item.enabled,
          group_name: item.group_name,
          region_tag: item.region_tag,
          api_key: item.api_key,
          original_api_key: item.api_key,
          credential_hint: item.credential_hint || "",
          original_credential_hint: item.credential_hint || "",
          selected: false,
          result: "",
          message: ""
        }));
        logJson(data);
        setConnection("已连接", "ok");
        toast(`已拉取 ${rows.length} 个提供商`, "ok");
        render();
      } catch (error) {
        setConnection("连接失败", "danger");
        handleError(error);
      } finally {
        setBusy(false);
      }
    }

    async function submitSelected() {
      const auth = readAuth();
      if (!auth) return;
      const selected = rows.filter((row) => row.selected && row.api_key.trim());
      if (!selected.length) {
        toast("没有可提交的选中行", "danger");
        return;
      }
      const payload = {
        ...auth,
        items: selected.map((row) => ({
          provider_id: row.id || undefined,
          provider_name: row.id ? undefined : row.name,
          api_key: row.api_key.trim(),
          credential_hint: row.credential_hint.trim() || undefined
        }))
      };
      setBusy(true, "提交中");
      try {
        const data = await postJson("/api/provider-credentials/batch-update", payload);
        applyResults(data.results || []);
        logJson(data);
        toast(`成功 ${data.success_count || 0} 个，失败 ${data.failed_count || 0} 个`, data.failed_count ? "danger" : "ok");
        render();
      } catch (error) {
        handleError(error);
      } finally {
        setBusy(false);
      }
    }

    async function postJson(path, payload) {
      const response = await fetch(`${normalizeBaseUrl(els.baseUrl.value)}${path}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const text = await response.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = {detail: text};
      }
      if (!response.ok) {
        const message = data.detail || data.message || `HTTP ${response.status}`;
        throw new Error(typeof message === "string" ? message : JSON.stringify(message));
      }
      return data;
    }

    function applyResults(results) {
      for (const result of results) {
        const row = findRow(result.provider_id, result.provider_name);
        if (!row) continue;
        row.result = result.success ? "success" : "failed";
        row.message = result.message || "";
        if (result.success && result.provider) {
          row.id = result.provider.id;
          row.name = result.provider.name;
          row.base_url = result.provider.base_url;
          row.enabled = result.provider.enabled;
          row.api_key = result.provider.api_key;
          row.original_api_key = result.provider.api_key;
          row.credential_hint = result.provider.credential_hint || "";
          row.original_credential_hint = result.provider.credential_hint || "";
          row.selected = false;
        }
      }
    }

    function findRow(providerId, providerName) {
      if (providerId !== null && providerId !== undefined) {
        return rows.find((row) => String(row.id) === String(providerId));
      }
      const name = String(providerName || "").trim().toLowerCase();
      return rows.find((row) => String(row.name || "").trim().toLowerCase() === name);
    }

    function importPastedRows() {
      const text = els.pasteBox.value.trim();
      if (!text) {
        toast("没有可导入内容", "danger");
        return;
      }
      try {
        const imported = parsePastedRows(text).map(normalizeRow);
        for (const item of imported) {
          const current = findRow(item.id, item.name);
          if (current) {
            current.api_key = item.api_key || current.api_key;
            current.credential_hint = item.credential_hint || current.credential_hint;
            current.selected = true;
            current.result = "";
            current.message = "";
          } else {
            rows.push({...item, selected: true, result: "", message: ""});
          }
        }
        toast(`已导入 ${imported.length} 行`, "ok");
        render();
      } catch (error) {
        handleError(error);
      }
    }

    function parsePastedRows(text) {
      if (text.startsWith("[") || text.startsWith("{")) {
        const parsed = JSON.parse(text);
        const list = Array.isArray(parsed) ? parsed : [parsed];
        return list.map((item) => ({
          id: item.provider_id ?? item.id ?? "",
          name: item.provider_name ?? item.name ?? "",
          api_key: item.api_key ?? "",
          credential_hint: item.credential_hint ?? item.hint ?? ""
        }));
      }
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (!lines.length) return [];
      const delimiter = lines[0].includes("\t") ? "\t" : ",";
      const header = lines[0].split(delimiter).map((item) => item.trim().toLowerCase());
      const hasHeader = header.some((item) => ["provider_id", "id", "provider_name", "name", "api_key", "credential_hint"].includes(item));
      const body = hasHeader ? lines.slice(1) : lines;
      return body.map((line) => {
        const cells = splitDelimited(line, delimiter);
        if (hasHeader) {
          const get = (...keys) => {
            const index = header.findIndex((item) => keys.includes(item));
            return index >= 0 ? cells[index] || "" : "";
          };
          return {
            id: get("provider_id", "id"),
            name: get("provider_name", "name"),
            api_key: get("api_key", "key"),
            credential_hint: get("credential_hint", "hint", "remark")
          };
        }
        return {
          id: cells[0] || "",
          name: cells[1] || "",
          api_key: cells[2] || "",
          credential_hint: cells[3] || ""
        };
      });
    }

    function splitDelimited(line, delimiter) {
      if (delimiter === "\t") return line.split("\t").map((item) => item.trim());
      const result = [];
      let current = "";
      let quoted = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        if (char === '"') {
          quoted = !quoted;
          continue;
        }
        if (char === "," && !quoted) {
          result.push(current.trim());
          current = "";
          continue;
        }
        current += char;
      }
      result.push(current.trim());
      return result;
    }

    function fillSample() {
      els.pasteBox.value = JSON.stringify([
        {provider_id: 23, api_key: "sk-new-key-1", credential_hint: "主密钥轮换"},
        {provider_name: "测试提供商", api_key: "sk-new-key-2", credential_hint: "备用密钥"}
      ], null, 2);
    }

    function addBlankRow() {
      rows.unshift(normalizeRow({
        id: "",
        name: "",
        base_url: "",
        enabled: true,
        api_key: "",
        original_api_key: "",
        credential_hint: "",
        original_credential_hint: "",
        selected: true,
        result: "",
        message: ""
      }));
      render();
    }

    function toggleSelectAll() {
      const visible = filteredRows();
      const shouldSelect = visible.some((row) => !row.selected);
      for (const row of visible) row.selected = shouldSelect;
      render();
    }

    function render() {
      updatePills();
      const visible = filteredRows();
      if (!rows.length) {
        els.tableHost.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const table = els.tableTemplate.content.cloneNode(true);
      const tbody = table.querySelector("tbody");
      for (const row of visible) tbody.appendChild(renderRow(row));
      els.tableHost.replaceChildren(table);
    }

    function renderRow(row) {
      const tr = document.createElement("tr");
      tr.dataset.dirty = String(isDirty(row));
      tr.dataset.result = row.result || "";

      tr.appendChild(cell(`<input type="checkbox" ${row.selected ? "checked" : ""} aria-label="选择 ${escapeHtml(row.name || row.id || "新行")}">`, "check-cell"));
      tr.querySelector("input[type='checkbox']").addEventListener("change", (event) => {
        row.selected = event.target.checked;
        updatePills();
      });

      const nameTd = document.createElement("td");
      const nameWrap = document.createElement("div");
      nameWrap.className = "name-cell";
      const idInput = textInput(row.id, "ID", "mono");
      idInput.addEventListener("input", () => {
        row.id = idInput.value.trim();
        row.selected = true;
        row.result = "";
        render();
      });
      const nameInput = textInput(row.name, "提供商名称");
      nameInput.addEventListener("input", () => {
        row.name = nameInput.value;
        row.selected = true;
        row.result = "";
        render();
      });
      nameWrap.appendChild(wrapLabeled("ID", idInput));
      nameWrap.appendChild(wrapLabeled("名称", nameInput));
      nameTd.appendChild(nameWrap);
      tr.appendChild(nameTd);

      tr.appendChild(cell(`<span class="mono">${escapeHtml(row.base_url || "-")}</span><div class="secondary">${row.enabled ? "已启用" : "已停用"}</div>`));

      const keyTd = document.createElement("td");
      const keyInput = textInput(row.api_key, "API Key", "key-input");
      keyInput.autocomplete = "off";
      keyInput.spellcheck = false;
      keyInput.addEventListener("input", () => {
        row.api_key = keyInput.value;
        row.selected = true;
        row.result = "";
        tr.dataset.dirty = String(isDirty(row));
        updatePills();
      });
      keyTd.appendChild(keyInput);
      tr.appendChild(keyTd);

      const hintTd = document.createElement("td");
      const hintInput = textInput(row.credential_hint, "备注", "hint-input");
      hintInput.addEventListener("input", () => {
        row.credential_hint = hintInput.value;
        row.selected = true;
        row.result = "";
        tr.dataset.dirty = String(isDirty(row));
        updatePills();
      });
      hintTd.appendChild(hintInput);
      tr.appendChild(hintTd);

      tr.appendChild(cell(resultLabel(row), "result"));

      const actionTd = document.createElement("td");
      const actions = document.createElement("div");
      actions.className = "row-actions";
      const copyBtn = button("复制", "btn small", () => copyText(row.api_key));
      const resetBtn = button("还原", "btn small", () => {
        row.api_key = row.original_api_key || "";
        row.credential_hint = row.original_credential_hint || "";
        row.result = "";
        render();
      });
      const removeBtn = button("移除", "btn small danger", () => {
        rows = rows.filter((item) => item !== row);
        render();
      });
      actions.append(copyBtn, resetBtn, removeBtn);
      actionTd.appendChild(actions);
      tr.appendChild(actionTd);
      return tr;
    }

    function filteredRows() {
      const keyword = els.keyword.value.trim().toLowerCase();
      const mode = els.filterMode.value.trim();
      return rows.filter((row) => {
        const matchesKeyword = !keyword || [row.id, row.name, row.base_url].some((value) => String(value || "").toLowerCase().includes(keyword));
        if (!matchesKeyword) return false;
        if (mode === "已修改") return isDirty(row);
        if (mode === "已选择") return row.selected;
        if (mode === "失败") return row.result === "failed";
        return true;
      });
    }

    function normalizeRow(input) {
      return {
        id: input.id === null || input.id === undefined ? "" : String(input.id).trim(),
        name: String(input.name || "").trim(),
        base_url: String(input.base_url || ""),
        enabled: Boolean(input.enabled ?? true),
        group_name: input.group_name || "",
        region_tag: input.region_tag || "",
        api_key: String(input.api_key || ""),
        original_api_key: String(input.original_api_key ?? input.api_key ?? ""),
        credential_hint: String(input.credential_hint || ""),
        original_credential_hint: String(input.original_credential_hint ?? input.credential_hint ?? ""),
        selected: Boolean(input.selected),
        result: input.result || "",
        message: input.message || ""
      };
    }

    function isDirty(row) {
      return row.api_key !== row.original_api_key || row.credential_hint !== row.original_credential_hint;
    }

    function resultLabel(row) {
      if (row.result === "success") return '<span class="pill ok">成功</span>';
      if (row.result === "failed") return `<span class="pill danger">${escapeHtml(row.message || "失败")}</span>`;
      if (isDirty(row)) return '<span class="pill warn">已修改</span>';
      return '<span class="pill">未修改</span>';
    }

    function updatePills() {
      els.countPill.textContent = `${rows.length} 个提供商`;
      els.dirtyPill.textContent = `${rows.filter(isDirty).length} 个待提交`;
    }

    function setConnection(text, kind) {
      els.connectionPill.textContent = text;
      els.connectionPill.className = `pill ${kind || ""}`.trim();
    }

    function readAuth() {
      const username = els.username.value.trim();
      const password = els.password.value;
      const baseUrl = normalizeBaseUrl(els.baseUrl.value);
      if (!baseUrl) {
        toast("请填写服务地址", "danger");
        return null;
      }
      if (!username || !password) {
        toast("请填写管理员账号和密码", "danger");
        return null;
      }
      els.baseUrl.value = baseUrl;
      persistSafeSettings();
      return {username, password};
    }

    function normalizeBaseUrl(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function setBusy(nextBusy, text) {
      busy = nextBusy;
      for (const button of [els.loadBtn, els.parseBtn, els.submitBtn, els.addRowBtn]) {
        button.disabled = busy;
      }
      if (text) setConnection(text, "warn");
    }

    function handleError(error) {
      const message = error && error.message ? error.message : String(error);
      els.resultLog.textContent = message;
      toast(message, "danger");
    }

    function logJson(data) {
      els.resultLog.textContent = JSON.stringify(data, null, 2);
    }

    function toast(message, kind) {
      const item = document.createElement("div");
      item.className = `toast-item ${kind || ""}`.trim();
      item.textContent = message;
      els.toast.appendChild(item);
      window.setTimeout(() => item.remove(), 4200);
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value || "");
        toast("已复制", "ok");
      } catch {
        toast("复制失败", "danger");
      }
    }

    function cell(html, className) {
      const td = document.createElement("td");
      if (className) td.className = className;
      td.innerHTML = html;
      return td;
    }

    function textInput(value, label, className) {
      const input = document.createElement("input");
      input.value = value || "";
      input.placeholder = label || "";
      if (className) input.className = className;
      return input;
    }

    function wrapLabeled(text, element) {
      const label = document.createElement("label");
      label.textContent = text;
      label.appendChild(element);
      return label;
    }

    function button(text, className, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = className;
      btn.textContent = text;
      btn.addEventListener("click", onClick);
      return btn;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
