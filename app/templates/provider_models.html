{% extends "base.html" %}
{% block content %}
<section class="panel-card section-shell provider-model-page-head">
    <div class="section-subhead">
        <div>
            <div class="panel-kicker">对象挂载</div>
            <h1>提供商模型挂载矩阵</h1>
        </div>
        <div class="hero-actions">
            <a class="btn btn-ghost interactive-btn" href="/providers" data-shell-link>返回提供商</a>
        </div>
    </div>
</section>

<section class="panel-card section-shell provider-model-panel" id="provider-model-section">
    <div class="table-toolbar filter-toolbar provider-model-filter-toolbar">
        <label>
            <span>模型名称</span>
            <input class="field-input search-input" id="provider-model-search" type="search" placeholder="搜索模型或提供商">
        </label>
        <label>
            <span>提供商</span>
            <select class="field-input" id="provider-model-provider-id">
                <option value="">全部提供商</option>
            </select>
        </label>
        <label>
            <span>启用状态</span>
            <select class="field-input" id="provider-model-enabled">
                <option value="">全部状态</option>
                <option value="true">已启用</option>
                <option value="false">已停用</option>
            </select>
        </label>
        <label>
            <span>模型健康</span>
            <select class="field-input" id="provider-model-health">
                <option value="">全部健康状态</option>
                <option value="healthy">健康</option>
                <option value="abnormal">异常</option>
                <option value="unknown">未检测</option>
            </select>
        </label>
        <label>
            <span>可信度</span>
            <select class="field-input" id="provider-model-trust">
                <option value="">全部可信度</option>
                <option value="trusted">可信</option>
                <option value="abnormal">异常</option>
                <option value="unknown">未检测</option>
            </select>
        </label>
        <label>
            <span>模型分组</span>
            <select class="field-input" id="provider-model-model-group">
                <option value="">全部分组</option>
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="qwen">通义千问</option>
                <option value="glm">智谱 GLM</option>
                <option value="doubao">豆包</option>
                <option value="kimi">Kimi</option>
                <option value="baichuan">百川</option>
                <option value="ernie">文心一言</option>
                <option value="hunyuan">腾讯混元</option>
                <option value="minimax">MiniMax</option>
                <option value="step">阶跃星辰</option>
                <option value="internlm">书生浦语</option>
                <option value="spark">讯飞星火</option>
                <option value="yi">零一万物</option>
                <option value="mistral">Mistral</option>
                <option value="llama">Llama</option>
                <option value="gemini">Gemini</option>
                <option value="claude">Claude</option>
                <option value="grok">Grok</option>
                <option value="cohere">Cohere</option>
                <option value="perplexity">Perplexity</option>
                <option value="unknown">未知分组</option>
            </select>
        </label>
        <label>
            <span>每页数量</span>
            <select class="field-input" id="provider-model-page-size">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </label>
    </div>
    <div class="provider-model-page-actions">
        <button class="btn btn-ghost interactive-btn" id="provider-model-test-page-btn" type="button">测试本页</button>
        <button class="btn btn-ghost interactive-btn" id="provider-model-trust-page-btn" type="button">可信检测本页</button>
    </div>
    <div class="provider-model-batch-toolbar" id="provider-model-batch-toolbar" hidden>
        <div class="provider-model-batch-meta">
            <strong id="provider-model-batch-count">已选 0 个挂载</strong>
            <span id="provider-model-batch-scope">当前选择可跨页保留</span>
        </div>
        <div class="provider-model-batch-actions">
            <button class="btn btn-ghost interactive-btn" id="provider-model-select-visible-btn" type="button">选择本页</button>
            <button class="btn btn-ghost interactive-btn" id="provider-model-clear-selection-btn" type="button">清空</button>
            <button class="btn btn-ghost interactive-btn" id="provider-model-test-selected-btn" type="button">测试选中</button>
            <button class="btn btn-ghost interactive-btn" id="provider-model-protocol-detect-selected-btn" type="button">协议检测选中</button>
            <button class="btn btn-ghost interactive-btn" id="provider-model-trust-selected-btn" type="button">可信检测选中</button>
        </div>
    </div>
    <div class="table-shell provider-table-shell provider-model-matrix-shell">
        <table class="data-table provider-data-table">
            <thead>
                <tr>
                    <th class="provider-model-select-col">
                        <input id="provider-model-select-page" type="checkbox" aria-label="选择当前页模型挂载">
                    </th>
                    <th>提供商</th>
                    <th>模型</th>
                    <th>模型健康</th>
                    <th>可信度</th>
                    <th>端点协议</th>
                    <th>能力</th>
                    <th>倍率 / 价格</th>
                    <th>质量</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="provider-model-table-body"></tbody>
        </table>
    </div>
    <div class="table-toolbar logs-pagination-bar provider-model-pagination-bar">
        <div class="logs-page-meta" id="provider-model-page-meta">第 1 页，共 1 页 · 共 0 条</div>
        <div class="logs-page-actions">
            <button class="btn btn-ghost interactive-btn" id="provider-model-prev-page-btn" type="button">上一页</button>
            <button class="btn btn-ghost interactive-btn" id="provider-model-next-page-btn" type="button">下一页</button>
        </div>
    </div>
</section>

<div class="modal-shell hidden" id="provider-model-edit-modal" aria-hidden="true">
    <div class="modal-card provider-model-edit-card" role="dialog" aria-modal="true" aria-labelledby="provider-model-edit-title" tabindex="-1">
        <div class="modal-head">
            <div>
                <div class="panel-kicker">挂载编辑</div>
                <h2 id="provider-model-edit-title">编辑模型挂载</h2>
                <div class="table-muted" id="provider-model-edit-subtitle">调整可信度、端点协议、倍率、价格和容量。</div>
            </div>
            <button class="icon-btn interactive-btn" id="provider-model-edit-close" type="button" aria-label="关闭模型挂载编辑">×</button>
        </div>
        <form class="provider-model-edit-form" id="provider-model-edit-form">
            <input type="hidden" id="provider-model-edit-provider-id">
            <input type="hidden" id="provider-model-edit-model-id">
            <div class="provider-model-edit-grid">
                <label>
                    <span>可信度</span>
                    <select class="field-input" id="provider-model-edit-trust">
                        <option value="passed">可信</option>
                        <option value="degraded">异常</option>
                        <option value="unknown">未检测</option>
                    </select>
                </label>
                <label>
                    <span>端点协议</span>
                    <select class="field-input" id="provider-model-edit-protocol">
                        <option value="responses">Responses</option>
                        <option value="chat_completions">Chat</option>
                        <option value="both">双协议</option>
                        <option value="gemini">Gemini</option>
                        <option value="claude_messages">Claude</option>
                    </select>
                </label>
                <label>
                    <span>模型分组</span>
                    <select class="field-input" id="provider-model-edit-group">
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="qwen">通义千问</option>
                        <option value="glm">智谱 GLM</option>
                        <option value="doubao">豆包</option>
                        <option value="kimi">Kimi</option>
                        <option value="baichuan">百川</option>
                        <option value="ernie">文心一言</option>
                        <option value="hunyuan">腾讯混元</option>
                        <option value="minimax">MiniMax</option>
                        <option value="step">阶跃星辰</option>
                        <option value="internlm">书生浦语</option>
                        <option value="spark">讯飞星火</option>
                        <option value="yi">零一万物</option>
                        <option value="mistral">Mistral</option>
                        <option value="llama">Llama</option>
                        <option value="gemini">Gemini</option>
                        <option value="claude">Claude</option>
                        <option value="grok">Grok</option>
                        <option value="cohere">Cohere</option>
                        <option value="perplexity">Perplexity</option>
                        <option value="unknown">未知分组</option>
                    </select>
                </label>
                <label>
                    <span>倍率</span>
                    <input class="field-input" id="provider-model-edit-multiplier" type="number" min="0.0001" step="0.0001" placeholder="例如 1">
                </label>
                <label>
                    <span>输入单价 $/1M</span>
                    <input class="field-input" id="provider-model-edit-input-price" type="number" min="0" step="0.0001" placeholder="留空表示未设置">
                </label>
                <label>
                    <span>输出单价 $/1M</span>
                    <input class="field-input" id="provider-model-edit-output-price" type="number" min="0" step="0.0001" placeholder="留空表示未设置">
                </label>
                <label>
                    <span>缓存单价 $/1M</span>
                    <input class="field-input" id="provider-model-edit-cache-price" type="number" min="0" step="0.0001" placeholder="留空表示未设置">
                </label>
                <label>
                    <span>缓存写入单价 $/1M</span>
                    <input class="field-input" id="provider-model-edit-cache-write-price" type="number" min="0" step="0.0001" placeholder="留空表示沿用输入单价">
                </label>
                <label>
                    <span>最大活跃请求</span>
                    <input class="field-input" id="provider-model-edit-max-active-requests" type="number" min="0" step="1" placeholder="留空继承提供商">
                </label>
                <label>
                    <span>最大流式请求</span>
                    <input class="field-input" id="provider-model-edit-max-active-streams" type="number" min="0" step="1" placeholder="留空继承提供商">
                </label>
                <label>
                    <span>最大 QPS</span>
                    <input class="field-input" id="provider-model-edit-max-qps" type="number" min="0" step="1" placeholder="留空继承提供商">
                </label>
                <label>
                    <span>最大 RPM</span>
                    <input class="field-input" id="provider-model-edit-max-rpm" type="number" min="0" step="1" placeholder="留空继承提供商">
                </label>
            </div>
            <div class="form-actions">
                <button class="btn btn-ghost interactive-btn" id="provider-model-edit-cancel" type="button">取消</button>
                <button class="btn btn-accent interactive-btn" id="provider-model-edit-submit" type="submit">保存</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-shell hidden" id="provider-test-result-modal" aria-hidden="true">
    <div class="modal-card modal-lg provider-modal-card" role="dialog" aria-modal="true" aria-labelledby="provider-test-result-modal-title" tabindex="-1">
        <div class="modal-head">
            <div>
                <div class="panel-kicker">测试回放</div>
                <h2 id="provider-test-result-modal-title">测试结果</h2>
            </div>
            <button class="icon-btn interactive-btn" id="provider-test-result-modal-close" type="button" aria-label="关闭测试结果窗口">×</button>
        </div>
        <div id="provider-test-result-modal-content"></div>
    </div>
</div>
{% endblock %}
