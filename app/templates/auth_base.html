<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "认证" }}</title>
    <script>
        (function () {
            try {
                const THEME_STORAGE_KEY = "aotu-theme";
                const STYLE_STORAGE_KEY = "aotu-style";
                const STYLE_PRESET_IDS = new Set(["jade", "ocean", "amber", "rose", "cobalt", "plum", "graphite", "forest", "sunset", "mist"]);
                const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                const storedStyle = localStorage.getItem(STYLE_STORAGE_KEY);
                const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                const initialTheme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : preferredTheme;
                const initialStyle = STYLE_PRESET_IDS.has(storedStyle) ? storedStyle : "jade";
                document.documentElement.dataset.theme = initialTheme;
                document.documentElement.dataset.style = initialStyle;
                document.documentElement.style.colorScheme = initialTheme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
                document.documentElement.dataset.style = "jade";
                document.documentElement.style.colorScheme = "light";
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='css/app.css') }}?v=20260531-10" rel="stylesheet">
</head>
<body
    data-page="{{ page_name or '' }}"
    data-page-role="auth"
    data-authenticated="{{ 'true' if current_user else 'false' }}"
    data-user-role="{{ current_user.role if current_user else '' }}"
>
    <div class="auth-appearance-bar">
        <button
            class="topbar-btn topbar-btn-ghost topbar-style-btn interactive-btn"
            id="style-toggle"
            type="button"
            aria-haspopup="dialog"
            aria-controls="appearance-modal"
            aria-label="打开全站风格选择器"
        >
            <span class="style-toggle-preview" aria-hidden="true"></span>
            <span class="topbar-action-copy">
                <strong id="style-toggle-label">玉阶绿</strong>
                <small id="style-toggle-meta">默认控制台风格</small>
            </span>
        </button>
        <button class="topbar-btn topbar-btn-ghost topbar-theme-btn interactive-btn" id="theme-toggle" type="button" aria-label="切换暗黑模式">
            <i class="bi bi-circle-half" aria-hidden="true"></i>
            <span id="theme-toggle-label">暗黑模式</span>
        </button>
    </div>
    <main class="auth-shell">
        {% block content %}{% endblock %}
    </main>
    <div class="modal-shell hidden" id="appearance-modal" aria-hidden="true">
        <div class="modal-card appearance-modal-card" role="dialog" aria-modal="true" aria-labelledby="appearance-modal-title" tabindex="-1">
            <div class="modal-head">
                <div>
                    <div class="panel-kicker">全站外观</div>
                    <h2 id="appearance-modal-title">一键切换整体风格</h2>
                    <p class="appearance-modal-intro">支持 10 套统一风格预设，亮色与暗黑模式会自动同步适配。</p>
                </div>
                <button class="icon-btn interactive-btn" id="appearance-modal-close" type="button" aria-label="关闭风格选择器">×</button>
            </div>
            <div class="appearance-modal-summary">
                <div class="appearance-summary-item">
                    <span>当前模式</span>
                    <strong id="appearance-current-mode">日间模式</strong>
                </div>
                <div class="appearance-summary-item">
                    <span>当前风格</span>
                    <strong id="appearance-current-style">玉阶绿</strong>
                </div>
            </div>
            <div class="appearance-preset-grid" id="appearance-preset-grid"></div>
        </div>
    </div>
    <div class="toast-stack" id="toast-stack"></div>
    <script src="{{ url_for('static', path='js/app.js') }}?v=20260531-09"></script>
</body>
</html>
