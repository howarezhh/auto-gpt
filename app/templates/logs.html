{% extends "base.html" %}
{% block content %}
<section class="page-heading">
    <div>
        <div class="eyebrow">日志中心</div>
        <h2 id="logs-page-title">请求日志中心</h2>
    </div>
</section>

<nav class="logs-segmented-nav" aria-label="日志类型" role="tablist">
    <button class="logs-segment active" type="button" role="tab" aria-selected="true" aria-controls="logs-request-panel" data-logging-tab="request">请求日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="exceptions">异常事件</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="health-runs">可用性检测日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="billing-events">计费日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="content-guard-events">内容防护日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="background-jobs">调度任务日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="admin-audits">后台审计日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="user-operations">用户操作日志</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="alert-events">告警事件</button>
    <button class="logs-segment" type="button" role="tab" aria-selected="false" aria-controls="logs-typed-panel" data-logging-tab="asset-events">素材日志</button>
</nav>

<section class="stats-grid" id="logs-request-summary-panel" data-logging-panel="request">
    <article class="metric-card"><span>当前请求量</span><strong data-log-summary="total_requests">0</strong></article>
    <article class="metric-card"><span>成功请求</span><strong data-log-summary="success_requests">0</strong></article>
    <article class="metric-card metric-card-alert"><span>失败请求</span><strong data-log-summary="failed_requests">0</strong></article>
    <article class="metric-card"><span>可计费请求</span><strong data-log-summary="billable_requests">0</strong></article>
    <article class="metric-card"><span>关联密钥数</span><strong data-log-summary="matched_api_keys">0</strong></article>
    <article class="metric-card"><span>输入 Token</span><strong data-log-summary="prompt_tokens">0 token</strong></article>
    <article class="metric-card"><span>输出 Token</span><strong data-log-summary="completion_tokens">0 token</strong></article>
    <article class="metric-card"><span>总 Token</span><strong data-log-summary="total_tokens">0 token</strong></article>
</section>

<section class="panel-card section-shell" id="logs-request-panel" data-logging-panel="request">
    <div class="section-subhead compact-section-subhead">
        <div>
            <div class="panel-kicker">日志列表</div>
            <h3>筛选与结果</h3>
        </div>
        <div class="data-workspace-actions">
            <div class="table-muted" id="logs-last-refresh" aria-live="polite">最近刷新：-</div>
            <div class="hero-actions">
                <button class="btn btn-ghost interactive-btn" id="logs-export-btn" type="button">导出请求日志</button>
                <button class="btn btn-ghost interactive-btn" id="logs-refresh-btn" type="button">刷新</button>
                <button class="btn btn-danger-soft interactive-btn" id="logs-delete-filtered-btn" type="button">删除筛选</button>
                <button class="btn btn-danger-soft interactive-btn" id="logs-clear-btn" type="button">清空请求日志</button>
            </div>
        </div>
    </div>
    <div class="data-workspace-card">
        <div class="filter-grid compact-filter-grid">
            <label>
                <span>日志类型</span>
                <select class="field-input" id="logs-log-type">
                    <option value="">全部</option>
                    <option value="chat">对话请求</option>
                    <option value="responses">响应请求</option>
                    <option value="moderations">内容审核请求</option>
                    <option value="files">文件请求</option>
                    <option value="gemini">Gemini 原生请求</option>
                    <option value="claude_messages">Claude 原生请求</option>
                    <option value="proxy_generic">通用代理日志</option>
                    <option value="api_client_auth">密钥鉴权失败日志</option>
                    <option value="unsupported_endpoint">不支持端点日志</option>
                    <option value="v1_preflight">CORS 预检日志</option>
                </select>
            </label>
            <label>
                <span>提供商</span>
                <select class="field-input" id="logs-provider-id">
                    <option value="">全部</option>
                </select>
            </label>
            <label>
                <span>模型ID</span>
                <select class="field-input" id="logs-model-name">
                    <option value="">全部</option>
                </select>
            </label>
            <label>
                <span>所属用户</span>
                <select class="field-input" id="logs-user-account-id">
                    <option value="">全部</option>
                </select>
            </label>
            <label>
                <span>密钥</span>
                <select class="field-input" id="logs-api-client-key-id">
                    <option value="">全部</option>
                </select>
            </label>
            <label>
                <span>成功状态</span>
                <select class="field-input" id="logs-success">
                    <option value="">全部</option>
                    <option value="true">成功</option>
                    <option value="false">失败</option>
                </select>
            </label>
        </div>
        <details class="logs-advanced-filter">
            <summary>高级筛选</summary>
            <div class="filter-grid compact-filter-grid">
                <label>
                    <span>开始时间</span>
                    <input class="field-input" id="logs-start-at" type="datetime-local">
                </label>
                <label>
                    <span>结束时间</span>
                    <input class="field-input" id="logs-end-at" type="datetime-local">
                </label>
                <label>
                    <span>提供商信任等级</span>
                    <select class="field-input" id="logs-provider-trust-level">
                        <option value="">全部</option>
                        <option value="official">官方</option>
                        <option value="trusted">可信</option>
                        <option value="standard">标准</option>
                        <option value="low">低信任</option>
                        <option value="blocked">已阻断</option>
                    </select>
                </label>
                <label>
                    <span>密钥标识</span>
                    <select class="field-input" id="logs-api-client-key-query">
                        <option value="">全部</option>
                    </select>
                </label>
                <label>
                    <span>手动用户</span>
                    <input class="field-input" id="logs-user-account-query" type="text" placeholder="输入用户名或用户 ID">
                </label>
                <label>
                    <span>手动模型ID</span>
                    <input class="field-input" id="logs-model-query" type="text" placeholder="输入模型ID关键字">
                </label>
                <label>
                    <span>手动密钥</span>
                    <input class="field-input" id="logs-api-client-key-query-manual" type="text" placeholder="输入密钥名称、前缀或 ID">
                </label>
                <label>
                    <span>租户</span>
                    <select class="field-input" id="logs-tenant-name">
                        <option value="">全部</option>
                    </select>
                </label>
                <label>
                    <span>项目</span>
                    <select class="field-input" id="logs-project-name">
                        <option value="">全部</option>
                    </select>
                </label>
                <label>
                    <span>应用</span>
                    <select class="field-input" id="logs-app-name">
                        <option value="">全部</option>
                    </select>
                </label>
                <label>
                    <span>环境</span>
                    <select class="field-input" id="logs-environment-name">
                        <option value="">全部</option>
                    </select>
                </label>
                <label>
                    <span>内容检测结果</span>
                    <select class="field-input" id="logs-content-guard-result">
                        <option value="">全部</option>
                        <option value="pass">通过</option>
                        <option value="review">需复核</option>
                        <option value="block">已拦截</option>
                    </select>
                </label>
                <label>
                    <span>内容风险等级</span>
                    <select class="field-input" id="logs-content-guard-risk-level">
                        <option value="">全部</option>
                        <option value="low">低</option>
                        <option value="medium">中</option>
                        <option value="high">高</option>
                    </select>
                </label>
                <label>
                    <span>内容处置动作</span>
                    <select class="field-input" id="logs-content-guard-action">
                        <option value="">全部</option>
                        <option value="allow">放行</option>
                        <option value="record">记录</option>
                        <option value="async_review">异步复核</option>
                        <option value="block">阻断</option>
                    </select>
                </label>
                <label>
                    <span>最终策略</span>
                    <select class="field-input" id="logs-content-guard-final-strategy">
                        <option value="">全部</option>
                        <option value="allow">放行</option>
                        <option value="record_only">仅记录</option>
                        <option value="async_review">异步复核</option>
                        <option value="block">阻断</option>
                        <option value="safe_error">安全错误</option>
                        <option value="switch_provider">切换提供商</option>
                        <option value="switch_provider_succeeded">切换成功</option>
                        <option value="switch_provider_exhausted">切换耗尽</option>
                    </select>
                </label>
                <label>
                    <span>检测阶段</span>
                    <select class="field-input" id="logs-content-guard-stage">
                        <option value="">全部</option>
                        <option value="non_stream_response">非流式响应</option>
                        <option value="stream_buffer">流式首段缓冲</option>
                        <option value="stream_chunk">流式分块</option>
                        <option value="runtime_async_review">异步复核</option>
                    </select>
                </label>
                <label>
                    <span>命中分类</span>
                    <input class="field-input" id="logs-content-guard-category" type="text" placeholder="输入分类标识">
                </label>
                <label>
                    <span>是否切换提供商</span>
                    <select class="field-input" id="logs-content-guard-switched-provider">
                        <option value="">全部</option>
                        <option value="true">已切换</option>
                        <option value="false">未切换</option>
                    </select>
                </label>
                <label>
                    <span>是否适配跳过</span>
                    <select class="field-input" id="logs-content-guard-adaptation-skipped">
                        <option value="">全部</option>
                        <option value="true">已跳过</option>
                        <option value="false">未跳过</option>
                    </select>
                </label>
                <label>
                    <span>会话键</span>
                    <input class="field-input" id="logs-conversation-key" type="text" placeholder="例如 user-001 或 request_id">
                </label>
                <input id="logs-exclude-health-checks" type="checkbox" checked hidden>
            </div>
        </details>
        <div class="table-shell">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>思维等级</th>
                        <th>用户 / 密钥</th>
                        <th>模型 / 提供商</th>
                        <th>结果</th>
                        <th>用量 / 用时</th>
                        <th>详情</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body"></tbody>
            </table>
        </div>
        <div class="table-toolbar logs-pagination-bar workspace-pagination-bar">
            <label class="logs-page-size">
                <span>每页数量</span>
                <select class="field-input" id="logs-page-size">
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
            </label>
            <div class="logs-page-meta" id="logs-page-meta">第 1 页，共 1 页</div>
            <div class="logs-page-actions">
                <button class="btn btn-ghost interactive-btn" id="logs-prev-page-btn" type="button">上一页</button>
                <button class="btn btn-ghost interactive-btn" id="logs-next-page-btn" type="button">下一页</button>
            </div>
        </div>
    </div>
</section>

<section class="panel-card section-shell hidden" id="logs-typed-panel" data-logging-panel="typed">
    <div class="section-subhead compact-section-subhead">
        <div>
            <div class="panel-kicker" id="typed-logs-kicker">类型化日志</div>
            <h3 id="typed-logs-title">异常事件</h3>
        </div>
        <div class="data-workspace-actions">
            <div class="table-muted" id="typed-logs-last-refresh" aria-live="polite">最近刷新：-</div>
            <button class="btn btn-ghost interactive-btn" id="typed-logs-export-btn" type="button">导出当前类型</button>
            <button class="btn btn-ghost interactive-btn" id="typed-logs-refresh-btn" type="button">刷新</button>
            <button class="btn btn-danger-soft interactive-btn" id="typed-logs-delete-filtered-btn" type="button">删除筛选</button>
            <button class="btn btn-danger-soft interactive-btn" id="typed-logs-clear-btn" type="button">清空当前类型</button>
        </div>
    </div>
    <div class="data-workspace-card">
        <div class="typed-logs-summary-grid" id="typed-logs-summary" aria-live="polite"></div>
        <div class="typed-logs-meta-strip" id="typed-logs-meta-strip"></div>
        <div class="filter-grid compact-filter-grid">
            <label>
                <span id="typed-logs-keyword-label">关键词</span>
                <input class="field-input" id="typed-logs-keyword" type="text" placeholder="trace、对象、错误码或摘要">
            </label>
            <label id="typed-logs-page-size-field">
                <span>每页数量</span>
                <select class="field-input" id="typed-logs-page-size">
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </label>
        </div>
        <div class="table-shell typed-logs-table-shell">
            <table class="data-table">
                <thead>
                    <tr id="typed-logs-table-head"></tr>
                </thead>
                <tbody id="typed-logs-table-body"></tbody>
            </table>
        </div>
        <div class="table-toolbar logs-pagination-bar workspace-pagination-bar">
            <div class="logs-page-meta" id="typed-logs-page-meta">第 1 页，共 1 页</div>
            <div class="logs-page-actions">
                <button class="btn btn-ghost interactive-btn" id="typed-logs-prev-page-btn" type="button">上一页</button>
                <button class="btn btn-ghost interactive-btn" id="typed-logs-next-page-btn" type="button">下一页</button>
            </div>
        </div>
    </div>
</section>

<div class="modal-shell hidden log-trace-shell" id="log-trace-modal" aria-hidden="true">
    <div class="modal-card modal-lg log-trace-card" role="dialog" aria-modal="true" aria-labelledby="log-trace-title" tabindex="-1">
        <div class="modal-head log-trace-head">
            <h3 id="log-trace-title">日志详情与 Trace</h3>
            <button class="icon-btn interactive-btn" id="log-trace-close" type="button" aria-label="关闭日志详情">×</button>
        </div>
        <div class="log-trace-body">
            <div class="log-detail-card-grid" id="log-detail-cards"></div>
            <details class="log-raw-detail">
                <summary>原始 JSON</summary>
                <pre class="code-block log-raw-json" id="log-trace-content">暂无 Trace</pre>
            </details>
        </div>
    </div>
</div>
{% endblock %}
